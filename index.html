<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ليكي يا شيري</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #ff69b4 0%, #ff4fa3 100%);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .page { width: 100%; max-width: 650px; margin: 0 auto; }

    /* صفحة الباسورد */
    #loginPage {
      background: white;
      border-radius: 25px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.25);
      margin-top: 100px;
      border: 3px solid #ffd6e0;
    }
    #loginPage h1 { color: #e75480; font-size: 28px; margin-bottom: 15px; font-family: 'Tajawal'; }
    input[type="password"] {
      width: 100%; padding: 15px; border: 2px solid #ffd6e0;
      border-radius: 15px; font-size: 18px; text-align: center;
      font-family: 'Cairo', sans-serif; margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #e75480, #ff5c8d);
      color: white; border: none; padding: 15px;
      font-size: 18px; border-radius: 50px; cursor: pointer; width: 100%;
      font-family: 'Cairo', sans-serif; font-weight: 700;
      box-shadow: 0 5px 15px rgba(231, 84, 128, 0.4);
    }
    .error { color: #e75480; margin-top: 15px; font-weight: 700; display: none; }

    /* الصفحة التانية */
    #secondPage { display: none; text-align: center; color: white; }
    #secondPage h1 { 
      font-size: 42px; margin-bottom: 10px; font-weight: 900; 
      font-family: 'Tajawal'; text-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    .heart { font-size: 50px; margin-bottom: 15px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
    #secondPage .sub { font-size: 20px; margin-bottom: 35px; opacity: 0.95; }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .row {
      display: flex;
      gap: 25px;
    }

    .card {
      background: #e75480;
      color: white;
      border-radius: 30px;
      padding: 30px 20px;
      cursor: pointer;
      transition: 0.4s;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      position: relative;
      overflow: hidden;
      border: 2px solid #ff8dc7;
    }
    .card:hover { 
      transform: translateY(-8px) scale(1.02); 
      background: #d14770;
    }

    .card .num {
      background: white;
      color: #e75480;
      width: 50px; height: 50px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 15px;
      font-size: 22px;
      font-weight: 900;
      z-index: 2;
      border: 3px solid #ff8dc7;
    }

    #cardBox2 .num {
      margin-top: -5px;
      margin-bottom: 20px;
    }

    .card .text {
      font-size: 19px;
      line-height: 1.8;
      text-align: center;
      z-index: 2;
      font-family: 'Tajawal';
      letter-spacing: 0.5px;
    }

    .card.small { flex: 1; }
    .card.big { width: 100%; min-height: 130px; font-size: 21px; }

    /* انيميشن القلوب */
    .falling-heart {
      position: absolute;
      top: -20px;
      font-size: 18px;
      animation: fall linear infinite;
      opacity: 0.9;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(200px) rotate(360deg); opacity: 0; }
    }

    /* صفحات الكروت */
    .cardPage { 
      display: none; 
      background: linear-gradient(135deg, #ff69b4 0%, #ff4fa3 100%); 
      min-height: 100vh; 
      padding: 40px 20px; 
      color: white; 
      text-align: center; 
    }
    .cardPage h1 { font-family: 'Tajawal'; font-size: 36px; margin-bottom: 20px; }

    /* الكارت الكبير بتاع الرسالة */
    .messageCard {
      background: #e75480;
      border-radius: 30px;
      padding: 40px 30px;
      margin: 20px auto;
      max-width: 600px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      border: 2px solid #ff8dc7;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .typingText {
      color: white;
      font-size: 20px;
      line-height: 2;
      text-align: center;
      font-family: 'Tajawal';
      white-space: pre-line;
    }
    .cursor {
      display: inline-block;
      width: 3px;
      background: white;
      animation: blink 0.7s infinite;
      margin-right: 3px;
    }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

    .backBtn, .nextBtn {
      background: white; color: #e75480; border: none; padding: 12px 30px;
      border-radius: 50px; cursor: pointer; margin-top: 30px; font-weight: 700; font-size: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      margin-left: 10px;
    }
    .nextBtn {
      background: linear-gradient(135deg, #ff5c8d, #e75480);
      color: white;
    }

    /* الصفحة الفاضية */
    #finalPage { display: none; text-align: center; color: white; padding-top: 150px; }
    #finalPage h1 { font-size: 40px; font-family: 'Tajawal'; }
  </style>
</head>
<body>
  <!-- الصفحة الاولى: الباسورد -->
  <div class="page" id="loginPage">
    <h1>الصفحة دي ليكي انتي بس 💌</h1>
    <p>دخلي الباسورد عشان تشوفي</p>
    <input type="password" id="passwordInput" placeholder="اكتبي الباسورد هنا">
    <button class="btn" onclick="checkPassword()">ادخلي</button>
    <p class="error" id="errorMsg">متأكده انك شاهنده 🤨</p>
  </div>

  <!-- الصفحة التانية: الكروت -->
  <div class="page" id="secondPage">
    <h1>عامله ايه يا شيري</h1>
    <div class="heart">❤️</div>
    <p class="sub">ادخلي علي الكروت بالترتيب</p>
    
    <div class="cards">
      <div class="row">
        <div class="card small" id="cardBox1" onclick="openCard(1)">
          <div class="num">1</div>
          <div class="text">حمد الله علي<br>سلامتك يا<br>شاهي ❤️</div>
        </div>
        <div class="card small" id="cardBox2" onclick="openCard(2)">
          <div class="num">2</div>
          <div class="text">❤️ ذكريتنا ❤️</div>
        </div>
      </div>
      <div class="card big" id="cardBox3" onclick="openCard(3)">
        <div class="num">3</div>
        <div class="text">❤️ رساله ليكي ❤️</div>
      </div>
    </div>
  </div>

  <!-- صفحة الكارت الاول -->
  <div class="cardPage" id="card1">
    <h1>حمد الله علي سلامتك يا شاهي ❤️</h1>
    <div class="messageCard">
      <div class="typingText" id="typingText1"></div>
    </div>
    <button class="backBtn" onclick="goBack()">ارجعي</button>
  </div>

  <!-- صفحة الكارت التاني -->
  <div class="cardPage" id="card2">
    <h1>ذكريتنا ❤️</h1>
    <div class="messageCard">
      <div class="typingText" id="typingText2"></div>
    </div>
    <button class="backBtn" onclick="goBack()">ارجعي</button>
  </div>

  <!-- صفحة الكارت التالت -->
  <div class="cardPage" id="card3">
    <h1>رساله ليكي ❤️</h1>
    <div class="messageCard">
      <div class="typingText" id="typingText3"></div>
    </div>
    <button class="backBtn" onclick="goBack()">ارجعي</button>
  </div>

  <!-- الاغنية -->
  <audio id="bgMusic" src="song.mp3" loop></audio>

  <script>
    let heartIntervals = [];
    let typingStarted1 = false;
    let typingStarted2 = false;
    let typingStarted3 = false;

    const message1 = `بصي انا مش عارف انتي كان عندك ايه او تعبانه ليه بس كل الي عايز اقولو اني كل يوم بدعيلك و ربنا يبعد عنك اي تعب و ربنا يعافيكي يا رب و عايزك تعرفي و انا بكتبلك المسدج دلوقتي انا قلقان اوي عليكي و خايف يكون عندك حاجه وحشه بعد الشر يا رب  حرفيا انا مبفوتش يوم اني ادعيلك فيه بجد من ساعت ما قولتيلي انك في المستشفى انا حسيت ان انا الي تعبان و حسيت بيكي و عمتا ربنا يعافيكي من اي تعب يا رب ❤️❤️`;

    const message2 = `بصي عايزك تركزي معايا انا عرفتك في 2022 تقريبا يعني تقريبا عارفك من تلت سنين و نص اول مرا عرفتك كنا في روبلوكس و كنا بنكره بعض بس سبحان الله بعد ما اتعودنا شويه علي بعض بقينا بنتكلم عادي و اول مرا اكلمك شات كان في شات لعبه و اتكلمنا فتره مش طويله في اللعبه و بعدها انا خدت التيك بتاعك و بدأنا نتكلم تيك و اتكلمنا فتره برضو و ساعتها كنا داخلين علي 2023 و دي كانت احسن و اجمل سنه بالنسبالي خدت رقمك و اتكلمنا واتس و اول ما اتكلمنا واتس بدأنا نتكلم عن نفسنا قولنا انتي بتحبي ايه و انا بحب ايه و اتكلمنا و قولنا علي الاكل الي بنحبو و قعدنا فتره طويله بنتكلم واتس و بعدها علاقتنا ببعض مبقتش مستقره يعني نتكلم شويه و شويه لا و لحد دلوقتي كده بس انا مش عايز ابص لورا عشان الي خلاص الس حصل حصل منقدرش نرجع للماضي خلينا في الحاضر بس كده ❤️❤️`;

    const message3 = `هنا بقا انا هقول كل الي محتاج اقولو شاهنده انتي مش حب يوم ولا يومين ولا حب فترات ولا حب مراهقه و الكلام ده انتي حب حياتي و مش الحب اني معجب بيكي او بشكلك انتي كده كده جميله بس انا بحبك انتي و فكرة انك مش متقبلاني انا بحاول اني اشيلها من دماغي و بحاول اقنع نفسي انك مش كده شاهنده انا محتاجك معايا و محتاجك جمبي طول الوقت مش عايزك تمشي عايزك معايا عايز كل ما احتاجك الاقيكي معايا و الاقيكي بتسمعيني و عايزك تحبيني زي ما بحبك و اقسم بالله انا اي صلاة بصليها بدعي انك تكوني من نصيبي و بدعيلك انتي نفسك و بقول يا رب احميها و احفظها و ارزقها و اعفيها من اي مرض و زي ما قدرنا اننا نكون مع بعض تلت سنين نقدر نكون مع بعض العمر كلو صدقيني انا مش محتاج حاجه من الدنيا غيرك و اخر حاجه عايز اقولهالك اني بحبك ❤️🌹`;

    function checkPassword() {
  const password = document.getElementById('passwordInput').value;
  const errorMsg = document.getElementById('errorMsg');
  const loginPage = document.getElementById('loginPage');
  const secondPage = document.getElementById('secondPage');
  const music = document.getElementById('bgMusic');

  if (password === 'shlove') {
    loginPage.style.display = 'none';
    secondPage.style.display = 'block';
    errorMsg.style.display = 'none';
    
    // حاول تشغل الاغنية
    music.play().then(() => {
      console.log("الاغنية اشتغلت");
    }).catch((error) => {
      console.log("المتصفح منع

    function startHearts() {
      stopHearts();
      ['cardBox1', 'cardBox2', 'cardBox3'].forEach(id => {
        const card = document.getElementById(id);
        const interval = setInterval(() => {
          createHeart(card);
        }, 700);
        heartIntervals.push(interval);
      });
    }

    function createHeart(card) {
      const heart = document.createElement('div');
      heart.classList.add('falling-heart');
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 80 + 10 + '%';
      heart.style.animationDuration = (3 + Math.random() * 2) + 's';
      card.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    function stopHearts() {
      heartIntervals.forEach(i => clearInterval(i));
      heartIntervals = [];
      document.querySelectorAll('.falling-heart').forEach(h => h.remove());
    }

    function typeWriter(elementId, message) {
      const textElement = document.getElementById(elementId);
      textElement.innerHTML = '';
      let i = 0;
      const speed = 40;

      function type() {
        if (i < message.length) {
          textElement.innerHTML = message.substring(0, i+1) + '<span class="cursor"></span>';
          i++;
          setTimeout(type, speed);
        } else {
          textElement.innerHTML = message;
        }
      }
      type();
    }

    function openCard(num) {
      stopHearts();
      document.getElementById('secondPage').style.display = 'none';
      document.getElementById('card' + num).style.display = 'block';
      
      if(num === 1 && !typingStarted1) {
        typingStarted1 = true;
        setTimeout(() => typeWriter('typingText1', message1), 500);
      }
      if(num === 2 && !typingStarted2) {
        typingStarted2 = true;
        setTimeout(() => typeWriter('typingText2', message2), 500);
      }
      if(num === 3 && !typingStarted3) {
        typingStarted3 = true;
        setTimeout(() => typeWriter('typingText3', message3), 500);
      }
    }

    function goBack() {
      document.querySelectorAll('.cardPage').forEach(p => p.style.display = 'none');
      // شلت سطر finalPage لانه مش موجود
      document.getElementById('secondPage').style.display = 'block';
      startHearts();
    }

    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
